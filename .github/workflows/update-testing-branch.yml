name: Update Testing Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-testing-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create or update testing branch
        run: |
          BRANCH_EXISTS=false
          DELETION_SUCCEEDED=false
          
          # Check if testing branch exists
          if git ls-remote --exit-code --heads origin testing; then
            BRANCH_EXISTS=true
            echo "Testing branch exists, attempting to delete..."
            if git push origin --delete testing; then
              echo "Successfully deleted testing branch"
              DELETION_SUCCEEDED=true
            else
              echo "ERROR: Could not delete testing branch."
              echo "The branch has protection rules that prevent both force-push and deletion."
              echo "Please either:"
              echo "  1. Modify the branch protection rules for 'testing' branch"
              echo "  2. Manually delete the 'testing' branch"
              echo "  3. Use a different branch name for testing"
              exit 1
            fi
          fi

          # Create a fresh testing branch from main
          git checkout -b testing

          # Remove all files except the essential ones for testing
          # Keep: www/, capacitor.config.json, package.json, package-lock.json, 
          #       LICENSE, README.md, README-CAPACITOR.md, TESTING_GUIDE.md

          # List of files/directories to keep
          KEEP_FILES=(
            "www"
            "capacitor.config.json"
            "package.json"
            "package-lock.json"
            "LICENSE"
            "README.md"
            "README-CAPACITOR.md"
            "TESTING_GUIDE.md"
            ".gitignore"
          )

          # Get all files and directories at root level
          for item in *; do
            keep=false
            for keep_item in "${KEEP_FILES[@]}"; do
              if [[ "$item" == "$keep_item" ]]; then
                keep=true
                break
              fi
            done
            if [[ "$keep" == "false" ]]; then
              rm -rf "$item"
              git rm -rf "$item" 2>/dev/null || true
            fi
          done

          # Commit the changes
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update testing branch with essential files only - synced from main"
          else
            echo "No changes to commit - testing branch would be identical to main"
            git commit --allow-empty -m "Sync testing branch from main (no changes)"
          fi

          # Push the testing branch
          git push origin testing

      - name: Summary
        run: |
          echo "## Testing Branch Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The testing branch has been updated with the essential files for PC and Android testing." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files included:" >> $GITHUB_STEP_SUMMARY
          echo "- www/ (index.html, app.js, styles.css)" >> $GITHUB_STEP_SUMMARY
          echo "- capacitor.config.json" >> $GITHUB_STEP_SUMMARY
          echo "- package.json" >> $GITHUB_STEP_SUMMARY
          echo "- package-lock.json" >> $GITHUB_STEP_SUMMARY
          echo "- LICENSE, README.md, README-CAPACITOR.md, TESTING_GUIDE.md" >> $GITHUB_STEP_SUMMARY
