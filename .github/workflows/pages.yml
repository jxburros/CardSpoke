name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # QA gate (CS-009): the deployment artifact is only produced after the
  # full unit suite, dependency audit, production build, and static smoke
  # checks all pass. A red QA job means nothing is deployed.
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm test

      # CS-107: high/critical advisories block the release, but the full JSON
      # report (including accepted moderate advisories) is kept as an artifact
      # and summarized so moderate issues cannot accumulate invisibly.
      - name: Dependency audit
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e '
            const r = JSON.parse(require("fs").readFileSync("npm-audit-report.json", "utf8"));
            const v = (r.metadata && r.metadata.vulnerabilities) || {};
            const line = Object.entries(v).map(([k, n]) => `${k}: ${n}`).join(", ") || "none";
            console.log("Vulnerabilities —", line);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY || "/dev/null",
              `### npm audit\n\nVulnerabilities — ${line}\n`);
          '
          npm audit --audit-level=high

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json

      - name: Production build
        run: npm run build

      - name: Static release smoke checks
        run: npm run smoke

      # CS-102: the browser-level release QA (encrypted unlock, locked-write
      # protection, corrupt-store quarantine, backup round trip, plugin
      # consent, dataset switching, XSS, dialogs, mobile overflow) is a
      # required deployment gate, not an advisory local script.
      - name: Install QA browser
        run: npx playwright install --with-deps chromium

      - name: Browser release QA
        run: npm run qa:browser

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-artifacts
          path: qa-artifacts/
          if-no-files-found: ignore

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: www

  deploy:
    needs: qa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 60
          reporting_interval: 10000

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 60
          reporting_interval: 10000

      - name: Wait before final retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 60
          reporting_interval: 10000
