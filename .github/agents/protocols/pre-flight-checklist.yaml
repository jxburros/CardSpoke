# Usage Guidelines

## For Agents
1. Run pre-flight checklist before starting work
2. If canProceed=false, report blockers and stop
3. If canProceed=true with warnings, proceed with caution
4. Include pre-flight report in agent result
5. Re-run checks if environment changes during work

## For Orchestrators
1. Require agents to run pre-flight checks
2. Validate pre-flight reports are included in results
3. Use blockers to understand why agents failed
4. Automatically resolve blockers when possible
5. Track check failures to identify systemic issues

## For Continuous Improvement
1. Add new checks when patterns of failures emerge
2. Adjust required vs optional based on impact
3. Optimize check performance (cache results when safe)
4. Update expected values as project evolves
5. Document new checks in this file

# Check Implementation

## Shell Command Checks
```bash
# Example: Git status check
check_git_status() {
  local output=$(git status --porcelain)
  if [ -z "$output" ]; then
    echo "PASS: Git status clean"
    return 0
  else
    echo "FAIL: Uncommitted changes detected"
    echo "$output"
    return 1
  fi
}
```

## Custom Validation Checks
```javascript
// Example: Version consistency check
function checkVersionConsistency() {
  const packageJson = JSON.parse(fs.readFileSync('package.json'));
  const appJs = fs.readFileSync('www/app.js', 'utf-8');
  const appVersion = appJs.match(/APP_VERSION = '([^']+)'/)?.[1];
  
  if (packageJson.version === appVersion) {
    return { passed: true, output: `Versions match: ${appVersion}` };
  } else {
    return {
      passed: false,
      output: `Version mismatch: package.json=${packageJson.version}, app.js=${appVersion}`,
      recommendation: `Update app.js to version ${packageJson.version}`
    };
  }
}
```

## Dependency Validation
```javascript
// Example: Check if dependency tasks are complete
function checkDependencies(taskId, dependencies) {
  const results = [];
  for (const depId of dependencies) {
    const depResult = loadAgentResult(depId);
    if (!depResult || depResult.status !== 'success') {
      results.push({
        passed: false,
        output: `${depId}: status=${depResult?.status || 'not found'}`,
        recommendation: `Complete ${depId} before proceeding`
      });
    }
  }
  return results.length === 0;
}
```

# Performance Considerations

## Optimization Strategies
1. Cache check results that don't change frequently
2. Run independent checks in parallel
3. Skip expensive checks in development mode
4. Use incremental validation where possible
5. Fail fast: stop on first required check failure

## Estimated Total Time
- Minimal checklist: ~3-5 seconds
- Standard checklist: ~20-25 seconds
- Full checklist: ~30-40 seconds

Balance thoroughness with speed based on task risk.

# Integration with Agent Workflows

Pre-flight checks fit into agent execution like this:

```
1. Agent receives task assignment
2. Agent loads task definition and dependencies
3. Agent runs pre-flight checklist
4. IF canProceed=false:
     - Report blockers to orchestrator
     - Send ERROR message
     - Stop execution
5. IF canProceed=true:
     - Log warnings if any
     - Proceed with task execution
     - Include pre-flight report in final result
```

This ensures no agent starts work in a bad state,
reducing wasted effort and cascading failures.
