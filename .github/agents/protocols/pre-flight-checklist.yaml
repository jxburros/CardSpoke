# Pre-Flight Checklist System
# Version: 1.0
# Purpose: Validate prerequisites before agent execution to prevent failures

# Overview
# The pre-flight checklist ensures agents start work in a known-good state.
# Each check validates a specific aspect of the environment or dependencies.
# Checks can be required (must pass) or optional (warning if failed).

# Checklist Structure

checklist:
  - name: string          # Human-readable check name
    check: string         # Description of what is checked
    command: string       # Command to run for validation (optional)
    required: boolean     # Whether this check must pass
    category: string      # Group checks by category
    estimatedTime: string # How long check takes (e.g., "2s")

# Standard Pre-Flight Checks

standardChecks:
  # Environment Checks
  - name: "Git Status Clean"
    check: "Working directory has no uncommitted changes"
    command: "git status --porcelain"
    expected: "empty output"
    required: true
    category: "environment"
    estimatedTime: "1s"
    failureMessage: "Please commit or stash changes before starting"
    
  - name: "On Correct Branch"
    check: "Current branch matches expected pattern"
    command: "git branch --show-current"
    expected: "matches feature/* or fix/* or main"
    required: true
    category: "environment"
    estimatedTime: "1s"
    failureMessage: "Switch to appropriate branch before starting"
    
  - name: "Branch Up to Date"
    check: "Local branch synced with remote"
    command: "git fetch && git status"
    expected: "Your branch is up to date"
    required: false
    category: "environment"
    estimatedTime: "2s"
    failureMessage: "Consider pulling latest changes: git pull"
    
  # Build & Test Checks
  - name: "Tests Passing"
    check: "All tests pass successfully"
    command: "npm test"
    expected: "exit code 0, no failures"
    required: true
    category: "quality"
    estimatedTime: "15s"
    failureMessage: "Fix failing tests before making changes"
    
  - name: "Build Succeeds"
    check: "Project builds without errors"
    command: "npm run build"
    expected: "exit code 0"
    required: true
    category: "quality"
    estimatedTime: "5s"
    failureMessage: "Fix build errors before proceeding"
    
  - name: "Linter Passes"
    check: "Code passes linting rules"
    command: "npm run lint"
    expected: "no errors"
    required: false
    category: "quality"
    estimatedTime: "3s"
    failureMessage: "Fix linting errors or add exceptions"
    
  # Dependency Checks
  - name: "Dependencies Installed"
    check: "node_modules directory exists and up to date"
    command: "npm ci --dry-run"
    expected: "no changes needed"
    required: true
    category: "dependencies"
    estimatedTime: "5s"
    failureMessage: "Run npm install to update dependencies"
    
  - name: "Dependencies Met"
    check: "Required artifacts from other tasks exist"
    command: "custom validation"
    expected: "all dependencies present"
    required: true
    category: "dependencies"
    estimatedTime: "1s"
    failureMessage: "Complete dependency tasks first: {list}"
    
  # File System Checks
  - name: "No File Conflicts"
    check: "No other agents working on same files"
    command: "check lock file or message bus"
    expected: "no conflicts"
    required: true
    category: "coordination"
    estimatedTime: "1s"
    failureMessage: "Wait for other agent to complete: {agent}"
    
  - name: "Disk Space Available"
    check: "Sufficient disk space for operation"
    command: "df -h ."
    expected: ">1GB free"
    required: false
    category: "resources"
    estimatedTime: "1s"
    failureMessage: "Low disk space, consider cleanup"
    
  # Version Checks
  - name: "Version Consistency"
    check: "package.json version matches app.js version"
    command: "custom validation"
    expected: "versions match"
    required: false
    category: "quality"
    estimatedTime: "1s"
    failureMessage: "Update version numbers to match"

# Task-Specific Checklists

taskChecklists:
  # For implementation tasks (Constructor)
  constructor:
    inherit: ["environment", "quality", "dependencies"]
    additional:
      - name: "Task Well-Defined"
        check: "Task has clear acceptance criteria"
        required: true
        category: "task"
        
      - name: "Examples Available"
        check: "Similar code patterns exist in codebase"
        required: false
        category: "task"
        
  # For bug fixes (Insect-Enthusiast)
  insectEnthusiast:
    inherit: ["environment", "quality"]
    additional:
      - name: "Bug Reproducible"
        check: "Can consistently reproduce the issue"
        required: true
        category: "task"
        
      - name: "Test Case Exists"
        check: "Failing test demonstrates bug"
        required: false
        category: "task"
        
  # For documentation (Librarian)
  librarian:
    inherit: ["environment"]
    additional:
      - name: "Changes Since Last Doc Update"
        check: "Code changes exist that need documentation"
        required: true
        category: "task"
        
      - name: "Main Branch Accessible"
        check: "Can fetch from main branch"
        required: true
        category: "task"
        
  # For cleanup (Bulldozer)
  bulldozer:
    inherit: ["environment"]
    additional:
      - name: "Backup Created"
        check: "Recent backup of repository exists"
        required: true
        category: "safety"
        
      - name: "Approval Received"
        check: "Human approval for destructive operations"
        required: true
        category: "safety"
        
  # For coordination (Showrunner, Orchestrator)
  orchestrator:
    inherit: ["environment", "dependencies"]
    additional:
      - name: "All Agents Available"
        check: "Required agents are defined and ready"
        required: true
        category: "coordination"
        
      - name: "No Blocking Operations"
        check: "No long-running operations in progress"
        required: true
        category: "coordination"

# Check Results

checkResult:
  check: string          # Check name
  passed: boolean        # Whether check passed
  output: string         # Command output or validation result
  duration: string       # How long check took
  timestamp: ISO8601     # When check was performed
  failureReason: string  # Why check failed (if applicable)
  recommendation: string # Suggested action to fix

# Pre-Flight Report

preFlightReport:
  agent: string          # Agent performing checks
  task: string           # Task being prepared for
  timestamp: ISO8601     # When checks were performed
  overallStatus: enum    # One of: pass | warn | fail
  checks: checkResult[]  # Individual check results
  requiredPassed: number # Count of required checks that passed
  requiredFailed: number # Count of required checks that failed
  optionalPassed: number # Count of optional checks that passed
  optionalFailed: number # Count of optional checks that failed
  totalDuration: string  # Total time for all checks
  canProceed: boolean    # Whether agent can start work
  blockers: string[]     # List of failed required checks
  warnings: string[]     # List of failed optional checks
  recommendations: string[] # Suggested actions before proceeding

# Example Reports

