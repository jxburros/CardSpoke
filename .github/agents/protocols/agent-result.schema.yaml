# Agent Result Protocol Schema
# Version: 1.0
# Purpose: Standardize how agents report task completion and results

agentResult:
  # Required fields
  agent: string           # Agent name (e.g., "constructor", "insect-enthusiast")
  task: string           # Task ID or description (e.g., "N1-tagging-infrastructure")
  status: enum           # One of: success | failure | partial | blocked
  timestamp: ISO8601     # When the result was generated
  
  # Optional but recommended fields
  artifacts:             # List of files created or modified
    - path: string       # Relative path from repo root
      changes: string    # Summary of changes (e.g., "+40 lines, -5 lines")
      type: enum         # One of: created | modified | deleted
  
  tests:                 # Test execution results
    passed: number       # Number of tests that passed
    failed: number       # Number of tests that failed
    skipped: number      # Number of tests that were skipped
    duration: string     # Total test execution time (e.g., "12.5ms")
    details: string[]    # Optional: list of failed test names
  
  blockers:              # List of reasons why task couldn't complete
    - type: enum         # One of: dependency | conflict | error | resource
      description: string # Human-readable blocker description
      resolution: string  # Suggested fix or next action
  
  nextSteps: string[]    # Recommended follow-up tasks or task IDs
  
  confidence: number     # Agent's confidence in result quality (0.0 - 1.0)
  
  validation:            # Validation checks performed
    preFlightChecks: boolean    # Pre-flight checklist passed
    testsRun: boolean           # Tests were executed
    lintPassed: boolean         # Code passed linting
    buildSucceeded: boolean     # Build completed successfully
  
  metadata:              # Additional context
    duration: string     # Time spent on task
    branch: string       # Git branch used
    commit: string       # Git commit hash (if committed)
    dependencies: string[] # Task IDs this task depended on
    notes: string        # Free-form notes or observations

# Status Definitions
statuses:
  success:
    description: "Task completed successfully, all acceptance criteria met"
    nextAction: "Can proceed to dependent tasks"
    
  failure:
    description: "Task attempted but failed to complete"
    nextAction: "Review blockers, attempt retry or escalate"
    
  partial:
    description: "Task partially completed, some objectives met"
    nextAction: "Review what's complete, decide whether to continue or rollback"
    
  blocked:
    description: "Task cannot proceed due to unmet dependencies or blockers"
    nextAction: "Resolve blockers before retrying"

# Blocker Types
blockerTypes:
  dependency:
    description: "Required task or artifact not yet complete"
    example: "N1-tagging-infrastructure must complete before N2-tag-management-ui"
    
  conflict:
    description: "Merge conflict or incompatible change detected"
    example: "File app.js has conflicting changes from another branch"
    
  error:
    description: "Technical error occurred during execution"
    example: "Tests failed with TypeError: Cannot read property 'tags' of undefined"
    
  resource:
    description: "Required resource unavailable (API, file, etc.)"
    example: "Cannot access GitHub API to fetch issue details"

# Example Usage

## Success Example
example_success:
  agent: "constructor"
  task: "N1-tagging-infrastructure"
  status: "success"
  timestamp: "2025-11-14T06:00:00Z"
  artifacts:
    - path: "www/app.js"
      changes: "+45 lines, -2 lines"
      type: "modified"
    - path: "tests/tags-api.test.js"
      changes: "+60 lines"
      type: "created"
  tests:
    passed: 19
    failed: 0
    skipped: 0
    duration: "8.5ms"
    details: []
  blockers: []
  nextSteps: ["N2-tag-management-ui", "N3-extend-store-mods"]
  confidence: 0.95
  validation:
    preFlightChecks: true
    testsRun: true
    lintPassed: true
    buildSucceeded: true
  metadata:
    duration: "18m 30s"
    branch: "feature/tagging-infrastructure"
    commit: "abc123def456"
    dependencies: []
    notes: "Tag API implemented with normalization and duplicate prevention"

## Failure Example
example_failure:
  agent: "constructor"
  task: "N2-tag-management-ui"
  status: "failure"
  timestamp: "2025-11-14T06:30:00Z"
  artifacts:
    - path: "www/app.js"
      changes: "+20 lines"
      type: "modified"
  tests:
    passed: 115
    failed: 2
    skipped: 0
    duration: "15.2ms"
    details:
      - "Tag input should validate empty tags"
      - "Tag autocomplete should show all existing tags"
  blockers:
    - type: "error"
      description: "Tests failed: Tag input validation not working"
      resolution: "Fix tag validation logic in addTag function"
  nextSteps: ["Fix validation logic", "Re-run tests"]
  confidence: 0.60
  validation:
    preFlightChecks: true
    testsRun: true
    lintPassed: true
    buildSucceeded: true
  metadata:
    duration: "25m 15s"
    branch: "feature/tag-ui"
    commit: "def456ghi789"
    dependencies: ["N1-tagging-infrastructure"]
    notes: "Partial implementation complete, validation logic needs fix"

## Blocked Example
example_blocked:
  agent: "constructor"
  task: "N4-extensions-page"
  status: "blocked"
  timestamp: "2025-11-14T07:00:00Z"
  artifacts: []
  tests:
    passed: 0
    failed: 0
    skipped: 0
    duration: "0ms"
  blockers:
    - type: "dependency"
      description: "N3-extend-store-mods not complete"
      resolution: "Wait for N3 completion or complete N3 first"
  nextSteps: ["Complete N3-extend-store-mods", "Retry N4"]
  confidence: 0.0
  validation:
    preFlightChecks: false
    testsRun: false
    lintPassed: true
    buildSucceeded: true
  metadata:
    duration: "2m 00s"
    branch: "main"
    commit: null
    dependencies: ["N3-extend-store-mods"]
    notes: "Cannot proceed without store.mods metadata structure"

# Integration Guidelines

## For Agents
1. Always produce an agent result at the end of your work
2. Be honest about status - partial success is better than claiming success
3. Include all blockers with clear resolution paths
4. Provide confidence scores based on test coverage and validation
5. List next steps to help orchestration

## For Orchestrators
1. Parse agent results to determine next actions
2. Use status to decide: proceed, retry, rollback, or escalate
3. Track blockers across agents to resolve dependencies
4. Use confidence scores for risk assessment
5. Aggregate results for progress reporting

## For Validation
1. Check that all required fields are present
2. Verify status matches actual outcome (tests passed = success)
3. Validate that artifacts listed actually exist
4. Confirm blockers are accurate and actionable
5. Ensure next steps are specific and achievable
