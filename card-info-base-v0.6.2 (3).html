<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Card Info Base</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- 
    =============================================================
    Card Info Base
    Version: 0.6.2
    Released by: jxburros
    Build date: 2025-11-06
    Notes: Phase 2 - JSON Import implementation
           Added validateImport(), remapIds(), importJSON()
           Upload button in header with placement options
           Support for importing cards as root or children
           ID collision prevention through remapping
    =============================================================
  -->
  <meta name="app:version" content="0.6.2">
  <meta name="app:author" content="jxburros">

  <style>
    /* =============================================================
       DESIGN TOKENS
       ============================================================= */
    :root {
      /* Color */
      --bg: #0b0f18; --panel: #131a2a; --card: #101724; --elev: #0f1522;
      --border: #3a4561; --ring: #86b7ff; --text: #f2f6ff; --muted: #b7c2d9;
      --accent: #86a8ff; --success: #67e2bc; --danger-bg: #351820; --danger: #ff9fb1;

      /* Typography */
      --ff: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      --fs-0: 14px; --fs-1: 16px; --fs-2: 18px; --fs-3: 20px; --fs-4: 24px; --lh: 1.6;

      /* Geometry */
      --radius: 14px; --radius-pill: 999px;
      --space-1: 6px; --space-2: 10px; --space-3: 14px; --space-4: 20px;

      /* Shadows & layout */
      --shadow-1: 0 12px 30px rgba(0,0,0,.35);
      --grid-min: 250px;
    }
    :root.light {
      --bg: #f6f7fb; --panel: #ffffff; --card: #ffffff; --elev: #ffffff; --border: #e7eaf1;
      --ring: #2b59ff; --text: #0e1220; --muted: #5b6275; --accent: #2b59ff; --success: #1ea97c;
      --danger-bg: #fff0f3; --danger: #c22644; --shadow-1: 0 10px 30px rgba(18,18,18,.06);
    }

    /* === Minimal mode overrides (applied when :root.minimal) === */
    :root.minimal {
      /* Subtler surfaces */
      --panel: #0e1422; --card: #0d1220; --elev: #0c111d; --border: #2a3550;
      --accent: #7e9bff; --muted: #99a6c4;

      /* Typography: crisper, slightly smaller & tighter */
      --ff: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans";
      --fs-0: 13px; --fs-1: 15px; --fs-2: 17px; --fs-3: 19px; --fs-4: 22px; --lh: 1.5;

      /* Geometry: tighter */
      --radius: 10px; --radius-pill: 18px;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;

      /* Layout: less shadow, wider grid min for cleaner lists */
      --shadow-1: none;
      --grid-min: 300px;
    }
    :root.light.minimal {
      --panel: #ffffff; --card: #ffffff; --elev: #ffffff; --border: #e5e8f0;
      --accent: #2b59ff; --muted: #626a7e; --shadow-1: none;
    }

    /* =============================================================
       BASE ELEMENTS
       ============================================================= */
    * { box-sizing: border-box }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: var(--fs-1)/var(--lh) var(--ff);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .app { max-width: 900px; margin: 0 auto; padding: calc(var(--space-4) + 8px) 10px 40px; }

    header.appbar {
      position: sticky; top: 0; z-index: 10;
      padding: var(--space-2) 0;
      margin-bottom: var(--space-3);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px) saturate(1.1);
    }
    :root.minimal header.appbar { backdrop-filter: none; }

    .appbar-inner {
      display: flex; gap: var(--space-2); align-items: center;
      max-width: 900px; margin: 0 auto;
    }
    .brand { font-weight: 700; letter-spacing: .3px; font-size: 1.2rem; }
    .spacer { flex: 1 }
    .crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .chip, .chip-current {
      border: 1px solid var(--border); border-radius: var(--radius-pill);
      background: var(--panel); color: var(--text);
      font-weight: 600; padding: 6px 13px; cursor: pointer; display: inline-flex; align-items: center;
    }
    .chip-current { background: var(--accent); color: #0a0f1a; border-color: var(--accent) }

    .btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 9px 15px;
      border-radius: var(--radius);
      font: inherit; font-weight: 600; cursor: pointer; box-shadow: var(--shadow-1);
      transition: border-color .15s ease, background-color .15s ease;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #0a0f1a }
    .btn.ghost { background: transparent }
    .btn.danger { background: var(--danger-bg); border-color: var(--danger); color: var(--danger) }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    :root.minimal .btn { box-shadow: none; padding: 8px 12px; }

    /* Dropdown button styles */
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropdown-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
      min-width: 200px;
      z-index: 1000;
    }
    .dropdown-menu.show {
      display: block;
    }
    .dropdown-item {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: none;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      font: inherit;
      font-weight: 500;
      transition: background-color .15s ease;
    }
    .dropdown-item:hover {
      background: var(--elev);
    }
    .dropdown-item:first-child {
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .dropdown-item:last-child {
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .dropdown-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .search {
      display: flex; align-items: center; gap: 7px;
      padding: var(--space-2) 11px; border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 2px); background: var(--elev)
    }
    .search input[type="search"] {
      border: 0; outline: 0; background: transparent; color: var(--text);
      width: 180px; font-size: 1em
    }
    .search button { border: 0; background: transparent; color: var(--muted); cursor: pointer }

    .card-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(var(--grid-min), 1fr)); gap: 15px }
    .card-tile {
      background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: var(--space-3) var(--space-3); cursor: pointer; box-shadow: var(--shadow-1);
      display: flex; flex-direction: column; gap: 8px; min-height: 80px
    }
    :root.minimal .card-tile { border-width: 1px; }

    .card-title-row { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
    .ct-title { font-weight: 700; font-size: 1.06rem }
    .ct-kid-count, .ct-preview, .ct-meta { color: var(--muted); font-size: .98em }
    .subhead { text-transform: uppercase; letter-spacing: .06em; font-size: 12px; color: var(--muted); margin: 7px 0 10px 2px }
    .empty { color: var(--muted); padding: 12px; text-align: center }
    .card-main-title { font-size: var(--fs-3); font-weight: 700; margin-bottom: 3px }
    .card-parent-ref { color: var(--text); font-size: .95em; margin-bottom: 14px; padding: 8px 12px; background: var(--elev); border: 1px solid var(--border); border-radius: 8px; display: inline-block }
    .card-parent-ref a { color: var(--accent); text-decoration: none; font-weight: 600 }
    .card-parent-ref a:hover { text-decoration: underline }
    .details { white-space: pre-wrap; margin-top: .6em; min-height: 36px }

    .children-preview-list { margin: 8px 0 3px 0; display: flex; gap: 13px; flex-wrap: wrap }
    .children-preview-tile { padding: 5px 12px; background: var(--elev); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: .99em; display: flex; align-items: center; gap: 6px; cursor: pointer }

    .action-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 21px 0 10px 0 }

    form label { display: block; color: var(--muted); font-size: .92em; text-transform: uppercase; letter-spacing: .04em; margin: 15px 0 6px }
    form input, form textarea, form select {
      display: block; width: 100%; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: calc(var(--radius) - 2px);
      background: var(--elev); color: var(--text); font: inherit; outline: 0
    }
    form input:focus, form textarea:focus, form select:focus { border-color: var(--ring) }
    form textarea { min-height: 140px; resize: vertical; line-height: 1.5 }
    .form-children-inline { display: flex; flex-direction: column; gap: 7px }
    .form-child-row { display: flex; gap: 6px; align-items: center }
    .form-child-row input { flex: 1; margin: 0 }
    .form-child-del { border: 0; background: var(--danger-bg); color: var(--danger); cursor: pointer; padding: 8px 12px; border-radius: 7px; font-size: .9em; font-weight: 600 }

    /* Sorting control */
    .sort-control {
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sort-control label {
      color: var(--muted);
      font-size: .9em;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin: 0;
    }
    .sort-control select {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 4px);
      background: var(--elev);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    /* Modal styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      padding: var(--space-4);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-3);
    }
    .modal-title {
      font-size: var(--fs-3);
      font-weight: 700;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }
    .modal-close:hover {
      background: var(--elev);
      color: var(--text);
    }
    .modal-body {
      margin-bottom: var(--space-3);
    }
    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .file-upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: var(--space-4);
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s ease;
      margin: var(--space-3) 0;
    }
    .file-upload-area:hover {
      border-color: var(--accent);
    }
    .file-upload-area.drag-over {
      border-color: var(--accent);
      background: var(--elev);
    }
    .upload-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }
    .upload-text {
      color: var(--muted);
      margin-bottom: 8px;
    }
    .upload-hint {
      color: var(--muted);
      font-size: 0.9em;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
      padding: 14px 18px;
      min-width: 250px;
      z-index: 2000;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .toast.show {
      display: flex;
      animation: slideIn 0.3s ease;
    }
    .toast.success {
      border-color: var(--success);
    }
    .toast.error {
      border-color: var(--danger);
    }
    .toast-icon {
      font-size: 20px;
    }
    .toast-message {
      flex: 1;
    }
    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <div class="brand">Card Info Base</div>
      <div class="spacer"></div>
      <div class="search" title="Search cards">
        <input type="search" placeholder="Search..." id="searchInput" />
        <button id="clearSearchBtn" style="display:none;">✕</button>
      </div>
      <button class="btn ghost" id="homeBtn" title="Home">🏠</button>
      <button class="btn ghost" id="backBtn" title="Back">←</button>
      <button class="btn primary" id="startAddCardBtn">+ New Card</button>
      <button class="btn ghost" id="uploadBtn">Upload</button>
      
      <!-- Export Dropdown -->
      <div class="dropdown" id="headerExportDropdown">
        <button class="btn ghost dropdown-toggle" id="headerExportToggle">
          Download ▾
        </button>
        <div class="dropdown-menu" id="headerExportMenu">
          <button class="dropdown-item" data-export-type="instance-json">All Cards (JSON)</button>
        </div>
      </div>

      <button class="btn ghost" id="themeToggle" role="switch" aria-checked="false" aria-label="Toggle theme">🌙</button>
      <button class="btn ghost" id="styleToggle">Style: Classic</button>
    </div>
  </header>

  <div class="app">
    <div class="crumbs" id="breadcrumbs"></div>
    <main id="main"></main>
  </div>

  <!-- Upload Modal -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Upload Cards (JSON)</div>
        <button class="modal-close" id="closeUploadModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="file-upload-area" id="fileUploadArea">
          <div class="upload-icon">📄</div>
          <div class="upload-text">Click to select or drag & drop JSON file</div>
          <div class="upload-hint">Supports card, subtree, and instance exports</div>
        </div>
        <input type="file" id="fileInput" accept=".json" style="display: none;" />
        
        <label style="display: block; color: var(--muted); font-size: .92em; text-transform: uppercase; letter-spacing: .04em; margin: 15px 0 6px">Import Location</label>
        <select id="importLocationSelect" style="display: block; width: 100%; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: calc(var(--radius) - 2px); background: var(--elev); color: var(--text); font: inherit;">
          <option value="root">Add as Root Cards</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn ghost" id="cancelUploadBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <div class="toast-icon" id="toastIcon"></div>
    <div class="toast-message" id="toastMessage"></div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    try {
      const APP_VERSION = "0.6.2";
      const SCHEMA_VERSION = 3;
      
      const headerEl = {
        themeToggle: document.getElementById('themeToggle'),
        styleToggle: document.getElementById('styleToggle'),
        search: document.getElementById('searchInput'),
        clearSearch: document.getElementById('clearSearchBtn'),
        startAddCardBtn: document.getElementById('startAddCardBtn'),
        uploadBtn: document.getElementById('uploadBtn'),
        homeBtn: document.getElementById('homeBtn'),
        backBtn: document.getElementById('backBtn'),
        exportDropdown: document.getElementById('headerExportDropdown'),
        exportToggle: document.getElementById('headerExportToggle'),
        exportMenu: document.getElementById('headerExportMenu')
      };

      const modalEl = {
        uploadModal: document.getElementById('uploadModal'),
        closeUploadModal: document.getElementById('closeUploadModal'),
        fileUploadArea: document.getElementById('fileUploadArea'),
        fileInput: document.getElementById('fileInput'),
        importLocationSelect: document.getElementById('importLocationSelect'),
        cancelUploadBtn: document.getElementById('cancelUploadBtn')
      };

      const toastEl = {
        toast: document.getElementById('toast'),
        toastIcon: document.getElementById('toastIcon'),
        toastMessage: document.getElementById('toastMessage')
      };

      const breadcrumbsEl = document.getElementById('breadcrumbs');
      const main = document.getElementById('main');
      let store = { rootOrder: [], cards: {}, mods: {} };
      let navState = { page: 'list', cardId: null, parentId: null, searchQuery: '' };
      let navHistory = [];
      let dirty = false;

      /* =========================
         ERROR & BOOT
         ========================= */
      function bootError(msg) {
        document.body.innerHTML = `<div style="margin:50px auto; max-width:600px; padding:20px; background:#351820; color:#ff9fb1; border:1px solid #ff9fb1; border-radius:12px;">${msg}</div>`;
      }

      /* =========================
         UTILITIES
         ========================= */
      function h(type, attrs = {}, ...children) {
        const el = document.createElement(type);
        Object.entries(attrs || {}).forEach(([k, v]) => {
          if (k === 'className') el.className = v;
          else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
          else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
          else el.setAttribute(k, v);
        });
        children.flat().forEach(child => {
          if (child) el.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
        });
        return el;
      }

      function sanitizeFilename(str) {
        return str.replace(/[^a-zA-Z0-9_\-]/g, '-').replace(/-+/g, '-').substring(0, 50);
      }

      function formatDate(timestamp) {
        if (!timestamp) return '';
        const d = new Date(timestamp);
        return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function showToast(message, type = 'success') {
        toastEl.toastMessage.textContent = message;
        toastEl.toastIcon.textContent = type === 'success' ? '✓' : '✕';
        toastEl.toast.className = 'toast show ' + type;
        setTimeout(() => {
          toastEl.toast.classList.remove('show');
        }, 3000);
      }

      /* =========================
         STORAGE
         ========================= */
      function save() {
        try {
          localStorage.setItem('nested_cards_store', JSON.stringify(store));
        } catch (e) {
          alert('Failed to save: ' + e.message);
        }
      }

      function load() {
        const raw = localStorage.getItem('nested_cards_store');
        if (!raw) {
          store = { rootOrder: [], cards: {}, mods: {} };
          save();
          return;
        }
        try {
          const parsed = JSON.parse(raw);
          store = { rootOrder: parsed.rootOrder || [], cards: parsed.cards || {}, mods: parsed.mods || {} };
        } catch (e) {
          bootError('Corrupted data.');
        }
      }

      /* =========================
         NAVIGATION
         ========================= */
      function goTo(page, opts = {}) {
        navHistory.push({ ...navState });
        navState = { page, cardId: opts.cardId ?? null, parentId: opts.parentId ?? null, searchQuery: opts.searchQuery ?? '' };
        render();
      }

      function goBack() {
        if (navHistory.length) {
          navState = navHistory.pop();
          render();
        }
      }

      /* =========================
         CARD MANAGEMENT
         ========================= */
      function createCard(title, body, parentId) {
        const id = 'card-' + Date.now() + '-' + Math.random().toString(36).substring(2, 9);
        const card = {
          id,
          title: title || '(Untitled)',
          body: body || '',
          parentId: parentId || null,
          children: [],
          createdAt: Date.now(),
          updatedAt: Date.now(),
          modsData: {}
        };
        store.cards[id] = card;
        if (parentId) {
          if (store.cards[parentId]) store.cards[parentId].children.push(id);
        } else {
          store.rootOrder.push(id);
        }
        return card;
      }

      function updateCard(id, updates) {
        const card = store.cards[id];
        if (!card) return;
        const oldParent = card.parentId;
        Object.assign(card, updates, { updatedAt: Date.now() });
        const newParent = card.parentId;
        if (oldParent !== newParent) {
          if (oldParent && store.cards[oldParent]) {
            store.cards[oldParent].children = store.cards[oldParent].children.filter(cid => cid !== id);
          } else {
            store.rootOrder = store.rootOrder.filter(cid => cid !== id);
          }
          if (newParent && store.cards[newParent]) {
            store.cards[newParent].children.push(id);
          } else {
            store.rootOrder.push(id);
          }
        }
      }

      function deleteCard(id) {
        const card = store.cards[id];
        if (!card) return;
        card.children.slice().forEach(cid => deleteCard(cid));
        if (card.parentId && store.cards[card.parentId]) {
          store.cards[card.parentId].children = store.cards[card.parentId].children.filter(cid => cid !== id);
        } else {
          store.rootOrder = store.rootOrder.filter(cid => cid !== id);
        }
        delete store.cards[id];
      }

      /* =========================
         JSON EXPORT FUNCTIONS (Phase 1)
         ========================= */
      
      /**
       * Recursively collect all card IDs in a subtree
       * @param {string} cardId - The root card ID
       * @returns {string[]} Array of all card IDs in the subtree
       */
      function collectSubtreeIds(cardId) {
        const card = store.cards[cardId];
        if (!card) return [];
        
        let ids = [cardId];
        card.children.forEach(childId => {
          ids = ids.concat(collectSubtreeIds(childId));
        });
        return ids;
      }

      /**
       * Build a JSON export package
       * @param {string[]} rootIds - Array of root card IDs to export
       * @param {string} exportType - 'card', 'subtree', or 'instance'
       * @returns {Object} Export package
       */
      function buildPackage(rootIds, exportType) {
        const pkg = {
          version: APP_VERSION,
          exportType: exportType,
          exportDate: new Date().toISOString(),
          rootIds: rootIds,
          cards: {},
          meta: {
            schemaVersion: SCHEMA_VERSION,
            notes: ''
          }
        };

        // Collect all cards to export
        let cardIdsToExport = [];
        rootIds.forEach(rootId => {
          if (exportType === 'card') {
            cardIdsToExport.push(rootId);
          } else if (exportType === 'subtree') {
            cardIdsToExport = cardIdsToExport.concat(collectSubtreeIds(rootId));
          }
        });

        // For instance export, include all cards
        if (exportType === 'instance') {
          cardIdsToExport = Object.keys(store.cards);
          pkg.rootIds = store.rootOrder;
        }

        // Sort cards alphabetically by ID for consistent exports
        cardIdsToExport.sort();

        // Build cards object
        cardIdsToExport.forEach(cardId => {
          const card = store.cards[cardId];
          if (card) {
            pkg.cards[cardId] = { ...card };
          }
        });

        // Include mods for instance exports
        if (exportType === 'instance' && Object.keys(store.mods).length > 0) {
          pkg.mods = { ...store.mods };
        }

        return pkg;
      }

      /**
       * Trigger a JSON file download
       * @param {string} filename - Suggested filename
       * @param {Object} data - Data to export
       */
      function downloadJSON(filename, data) {
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      /**
       * Handle export action
       * @param {string} exportType - 'card', 'subtree', or 'instance'
       * @param {string|null} cardId - Card ID (for card/subtree exports)
       */
      function handleExport(exportType, cardId = null) {
        let rootIds = [];
        let filename = '';
        let pkgType = '';

        if (exportType === 'instance-json') {
          rootIds = store.rootOrder;
          pkgType = 'instance';
          const dateStr = new Date().toISOString().split('T')[0];
          filename = `card-info-base-instance-${dateStr}.json`;
        } else if (exportType === 'card-json') {
          rootIds = [cardId];
          pkgType = 'card';
          const card = store.cards[cardId];
          const titleSlug = sanitizeFilename(card?.title || 'card');
          filename = `${titleSlug}-card.json`;
        } else if (exportType === 'subtree-json') {
          rootIds = [cardId];
          pkgType = 'subtree';
          const card = store.cards[cardId];
          const titleSlug = sanitizeFilename(card?.title || 'card');
          filename = `${titleSlug}-subtree.json`;
        }

        const pkg = buildPackage(rootIds, pkgType);
        downloadJSON(filename, pkg);
      }

      /* =========================
         JSON IMPORT FUNCTIONS (Phase 2)
         ========================= */
      
      /**
       * Validate an import package structure
       * @param {Object} pkg - The package to validate
       * @returns {Object} { valid: boolean, error: string|null }
       */
      function validateImport(pkg) {
        // Check basic structure
        if (!pkg || typeof pkg !== 'object') {
          return { valid: false, error: 'Invalid JSON structure' };
        }

        // Check for required fields
        if (!pkg.version) {
          return { valid: false, error: 'Missing version field' };
        }
        if (!pkg.exportType || !['card', 'subtree', 'instance'].includes(pkg.exportType)) {
          return { valid: false, error: 'Invalid or missing exportType' };
        }
        if (!pkg.cards || typeof pkg.cards !== 'object') {
          return { valid: false, error: 'Missing or invalid cards object' };
        }
        if (!pkg.rootIds || !Array.isArray(pkg.rootIds)) {
          return { valid: false, error: 'Missing or invalid rootIds array' };
        }

        // Check that cards object is not empty
        if (Object.keys(pkg.cards).length === 0) {
          return { valid: false, error: 'No cards found in import' };
        }

        // Validate each card has required fields
        for (const [cardId, card] of Object.entries(pkg.cards)) {
          if (!card.id) {
            return { valid: false, error: `Card missing id field: ${cardId}` };
          }
          if (card.title === undefined) {
            return { valid: false, error: `Card missing title field: ${cardId}` };
          }
          if (!Array.isArray(card.children)) {
            return { valid: false, error: `Card has invalid children array: ${cardId}` };
          }
        }

        return { valid: true, error: null };
      }

      /**
       * Remap all IDs in a package to avoid collisions
       * @param {Object} pkg - The package to remap
       * @returns {Object} Package with remapped IDs
       */
      function remapIds(pkg) {
        const idMap = {};
        
        // Generate new IDs for all cards
        Object.keys(pkg.cards).forEach(oldId => {
          const newId = 'card-' + Date.now() + '-' + Math.random().toString(36).substring(2, 9);
          idMap[oldId] = newId;
        });

        // Create new cards object with remapped IDs
        const newCards = {};
        Object.entries(pkg.cards).forEach(([oldId, card]) => {
          const newId = idMap[oldId];
          newCards[newId] = {
            ...card,
            id: newId,
            parentId: card.parentId ? (idMap[card.parentId] || null) : null,
            children: card.children.map(childId => idMap[childId] || childId).filter(id => idMap[id]),
            createdAt: card.createdAt || Date.now(),
            updatedAt: Date.now(),
            modsData: card.modsData || {}
          };
        });

        // Remap rootIds
        const newRootIds = pkg.rootIds.map(oldId => idMap[oldId] || oldId).filter(id => idMap[id]);

        return {
          ...pkg,
          cards: newCards,
          rootIds: newRootIds,
          idMap: idMap // Include mapping for reference
        };
      }

      /**
       * Import JSON package into the store
       * @param {Object} pkg - The validated and remapped package
       * @param {string} mode - 'root' or a cardId to add as children
       */
      function importJSON(pkg, mode) {
        const remappedPkg = remapIds(pkg);
        
        // Add all cards to store
        Object.entries(remappedPkg.cards).forEach(([cardId, card]) => {
          store.cards[cardId] = card;
        });

        // Handle placement based on mode
        if (mode === 'root') {
          // Add root cards to store.rootOrder
          remappedPkg.rootIds.forEach(cardId => {
            if (store.cards[cardId] && !store.rootOrder.includes(cardId)) {
              store.rootOrder.push(cardId);
            }
          });
        } else {
          // Add as children of specified parent
          const parentCard = store.cards[mode];
          if (parentCard) {
            remappedPkg.rootIds.forEach(cardId => {
              if (store.cards[cardId]) {
                // Update the imported card's parentId
                store.cards[cardId].parentId = mode;
                // Add to parent's children
                if (!parentCard.children.includes(cardId)) {
                  parentCard.children.push(cardId);
                }
              }
            });
          }
        }

        // Import mods if it's an instance export
        if (pkg.exportType === 'instance' && pkg.mods) {
          Object.entries(pkg.mods).forEach(([modId, mod]) => {
            if (!store.mods[modId]) {
              store.mods[modId] = mod;
            }
          });
        }

        save();
        
        return {
          success: true,
          cardCount: Object.keys(remappedPkg.cards).length,
          rootIds: remappedPkg.rootIds
        };
      }

      /**
       * Populate import location dropdown with all cards
       */
      function updateImportLocationOptions() {
        const select = modalEl.importLocationSelect;
        if (!select) return;
        
        // Clear and add root option
        select.innerHTML = '<option value="root">Add as Root Cards</option>';
        
        // Add all cards as potential parents, sorted alphabetically
        Object.values(store.cards)
          .sort((a, b) => {
            const A = (a.title || '').toLowerCase();
            const B = (b.title || '').toLowerCase();
            return A.localeCompare(B);
          })
          .forEach(card => {
            const option = document.createElement('option');
            option.value = card.id;
            option.textContent = `Add as children of: ${card.title || '(Untitled)'}`;
            select.appendChild(option);
          });

      /* =========================
         DROPDOWN HELPERS
         ========================= */
      function setupDropdown(toggleBtn, menu) {
        if (!toggleBtn || !menu) return;

        toggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const isShown = menu.classList.contains('show');
          // Close all other dropdowns
          document.querySelectorAll('.dropdown-menu.show').forEach(m => m.classList.remove('show'));
          if (!isShown) {
            menu.classList.add('show');
          }
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', () => {
          menu.classList.remove('show');
        });

        // Prevent menu clicks from closing dropdown
        menu.addEventListener('click', (e) => {
          e.stopPropagation();
        });
      }

      /* =========================
         BREADCRUMBS
         ========================= */
      function renderBreadcrumbs() {
        breadcrumbsEl.innerHTML = '';
        if (navState.page === 'search') {
          breadcrumbsEl.appendChild(h('div', { className: 'chip-current' }, 'Search Results'));
          return;
        }
        if (navState.page === 'edit') {
          const chip = h('div', { className: 'chip-current' }, navState.cardId ? 'Edit Card' : 'New Card');
          breadcrumbsEl.appendChild(chip);
          return;
        }
        let current = navState.cardId;
        const path = [];
        while (current) {
          const c = store.cards[current];
          if (!c) break;
          path.unshift(c);
          current = c.parentId;
        }
        if (path.length === 0) {
          breadcrumbsEl.appendChild(h('div', { className: 'chip-current' }, 'All Cards'));
        } else {
          const home = h('div', { className: 'chip', onclick: () => goTo('list', { cardId: null }) }, 'All Cards');
          breadcrumbsEl.appendChild(home);
          path.forEach((c, i) => {
            const isCurrent = (i === path.length - 1 && navState.page === 'list');
            const cls = isCurrent ? 'chip-current' : 'chip';
            const chip = h('div', { className: cls, onclick: isCurrent ? null : () => goTo('list', { cardId: c.id }) }, c.title || '(Untitled)');
            breadcrumbsEl.appendChild(chip);
          });
        }

            case "list": renderCardList(); break;
            case "search": renderSearchResults(); break;
            case "edit": renderEditCard(); break;
            default: renderCardList();
          }
        } catch (e) {
          bootError('Render failed: ' + (e.message || e));
        }
      }

      /* =========================
         THEME / STYLE TOGGLES
         ========================= */
      const applyTheme = (theme) => {
        if (theme === 'light') document.documentElement.classList.add('light');
        else document.documentElement.classList.remove('light');
        try { localStorage.setItem('nested_cards_theme', theme); } catch { }
        const t = headerEl.themeToggle; if (t) t.setAttribute('aria-checked', theme === 'light' ? 'true' : 'false');
      };
      const applyStyle = (styleMode) => {
        const minimal = styleMode === 'minimal';
        document.documentElement.classList.toggle('minimal', minimal);
        try { localStorage.setItem('nested_cards_style', minimal ? 'minimal' : 'classic'); } catch { }
        const st = headerEl.styleToggle; if (st) st.textContent = 'Style: ' + (minimal ? 'Minimal' : 'Classic');
      };

      applyTheme(localStorage.getItem('nested_cards_theme') || 'dark');
      applyStyle(localStorage.getItem('nested_cards_style') || 'classic');

      if (headerEl.themeToggle) headerEl.themeToggle.onclick = () => {
        const isLight = !document.documentElement.classList.contains('light');
        applyTheme(isLight ? 'light' : 'dark');
      };
      if (headerEl.styleToggle) headerEl.styleToggle.onclick = () => {
        const next = document.documentElement.classList.contains('minimal') ? 'classic' : 'minimal';
        applyStyle(next);
      };
      if (headerEl.search) {
        headerEl.search.addEventListener('input', e => { if (headerEl.clearSearch) headerEl.clearSearch.style.display = e.target.value.trim() ? "inline" : "none"; });
        headerEl.search.onkeydown = (e) => { if (e.key === "Enter" && headerEl.search.value.trim()) { navState.searchQuery = headerEl.search.value.trim(); goTo('search'); } };
      }
      if (headerEl.clearSearch) headerEl.clearSearch.onclick = () => { if (headerEl.search) headerEl.search.value = ""; headerEl.clearSearch.style.display = "none"; if (navState.page === "search") goBack(); };
      if (headerEl.startAddCardBtn) headerEl.startAddCardBtn.onclick = () => goTo('edit', { cardId: null, parentId: null });
      if (headerEl.homeBtn) headerEl.homeBtn.onclick = () => goTo('list', { cardId: null });
      if (headerEl.backBtn) headerEl.backBtn.onclick = () => goBack();

      // Setup header export dropdown
      setupDropdown(headerEl.exportToggle, headerEl.exportMenu);
      if (headerEl.exportMenu) {
        headerEl.exportMenu.addEventListener('click', (e) => {
          if (e.target.classList.contains('dropdown-item')) {
            const exportType = e.target.getAttribute('data-export-type');
            handleExport(exportType);
            headerEl.exportMenu.classList.remove('show');
          }
        });
      }

      /* =========================
         UPLOAD MODAL HANDLERS
         ========================= */
      
      // Open upload modal
      if (headerEl.uploadBtn) {
        headerEl.uploadBtn.onclick = () => {
          updateImportLocationOptions();
          modalEl.uploadModal.classList.add('show');
        };
      }

      // Close modal handlers
      if (modalEl.closeUploadModal) {
        modalEl.closeUploadModal.onclick = () => {
          modalEl.uploadModal.classList.remove('show');
        };
      }
      if (modalEl.cancelUploadBtn) {
        modalEl.cancelUploadBtn.onclick = () => {
          modalEl.uploadModal.classList.remove('show');
        };
      }

      // Click outside modal to close
      if (modalEl.uploadModal) {
        modalEl.uploadModal.onclick = (e) => {
          if (e.target === modalEl.uploadModal) {
            modalEl.uploadModal.classList.remove('show');
          }
        };
      }

      // File upload area click
      if (modalEl.fileUploadArea) {
        modalEl.fileUploadArea.onclick = () => {
          modalEl.fileInput.click();
        };
      }

      // Drag and drop handlers
      if (modalEl.fileUploadArea) {
        modalEl.fileUploadArea.addEventListener('dragover', (e) => {
          e.preventDefault();
          modalEl.fileUploadArea.classList.add('drag-over');
        });

        modalEl.fileUploadArea.addEventListener('dragleave', () => {
          modalEl.fileUploadArea.classList.remove('drag-over');
        });

        modalEl.fileUploadArea.addEventListener('drop', (e) => {
          e.preventDefault();
          modalEl.fileUploadArea.classList.remove('drag-over');
          
          const files = e.dataTransfer.files;
          if (files.length > 0) {
            handleFileUpload(files[0]);
          }
        });
      }

      // File input change handler
      if (modalEl.fileInput) {
        modalEl.fileInput.addEventListener('change', (e) => {
          const files = e.target.files;
          if (files.length > 0) {
            handleFileUpload(files[0]);
          }
        });
      }

      // Handle file upload and import
      function handleFileUpload(file) {
        if (!file.name.endsWith('.json')) {
          showToast('Please upload a JSON file', 'error');
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const pkg = JSON.parse(e.target.result);
            
            // Validate the package
            const validation = validateImport(pkg);
            if (!validation.valid) {
              showToast(validation.error, 'error');
              return;
            }

            // Get import location
            const importMode = modalEl.importLocationSelect.value;

            // Perform import
            const result = importJSON(pkg, importMode);
            
            if (result.success) {
              modalEl.uploadModal.classList.remove('show');
              modalEl.fileInput.value = ''; // Reset file input
              
              showToast(`Successfully imported ${result.cardCount} card${result.cardCount > 1 ? 's' : ''}`, 'success');
              
              // Navigate to appropriate view
              if (importMode === 'root') {
                goTo('list', { cardId: null });
              } else {
                goTo('list', { cardId: importMode });
              }
              
              render();
            }
          } catch (err) {
            showToast('Invalid JSON file: ' + err.message, 'error');
          }
        };
        
        reader.onerror = () => {
          showToast('Failed to read file', 'error');
        };
        
        reader.readAsText(file);
      }

      // Boot
      load();
      goTo('list', { cardId: null });
    } catch (e) {
      bootError(e.message || String(e));
    }
  });
  </script>
</body>
</html>
