<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="192" height="192" fill="#0b0f18" rx="24"/>
  
  <!-- Card representation -->
  <g transform="translate(48, 48)">
    <!-- Main card -->
    <rect x="0" y="0" width="96" height="96" fill="#131a2a" stroke="#86a8ff" stroke-width="3" rx="8"/>
    
    <!-- Title line -->
    <rect x="12" y="12" width="48" height="6" fill="#86a8ff" rx="2"/>
    
    <!-- Content lines -->
    <rect x="12" y="24" width="64" height="4" fill="#b7c2d9" rx="1"/>
    <rect x="12" y="32" width="48" height="4" fill="#b7c2d9" rx="1"/>
    
    <!-- Info badge -->
    <circle cx="80" cy="16" r="8" fill="#67e2bc"/>
  </g>
</svg>