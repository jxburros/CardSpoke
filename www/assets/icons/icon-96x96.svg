<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="96" height="96" fill="#0b0f18" rx="12"/>
  
  <!-- Card representation -->
  <g transform="translate(24, 24)">
    <!-- Main card -->
    <rect x="0" y="0" width="48" height="48" fill="#131a2a" stroke="#86a8ff" stroke-width="3" rx="8"/>
    
    <!-- Title line -->
    <rect x="6" y="6" width="24" height="3" fill="#86a8ff" rx="2"/>
    
    <!-- Content lines -->
    <rect x="6" y="12" width="32" height="2" fill="#b7c2d9" rx="1"/>
    <rect x="6" y="16" width="24" height="2" fill="#b7c2d9" rx="1"/>
    
    <!-- Info badge -->
    <circle cx="40" cy="8" r="4" fill="#67e2bc"/>
  </g>
</svg>