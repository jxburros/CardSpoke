  <!-- Card representation -->
  <g transform="translate(38, 38)">
    <!-- Main card -->
    <rect x="0" y="0" width="76" height="76" fill="#131a2a" stroke="#86a8ff" stroke-width="3" rx="8"/>
    
    <!-- Title line -->
    <rect x="9" y="9" width="38" height="4" fill="#86a8ff" rx="2"/>
    
    <!-- Content lines -->
    <rect x="9" y="19" width="50" height="3" fill="#b7c2d9" rx="1"/>
    <rect x="9" y="25" width="38" height="3" fill="#b7c2d9" rx="1"/>
    
    <!-- Info badge -->
    <circle cx="64" cy="12" r="6" fill="#67e2bc"/>
