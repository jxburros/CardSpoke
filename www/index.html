<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CardSpoke</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="app:version" content="0.17.0">
  <meta name="app:author" content="jxburros">

  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-eval' https://accounts.google.com https://alcdn.msauth.net;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    connect-src 'self' https://www.googleapis.com https://graph.microsoft.com https://login.microsoftonline.com *;
    img-src 'self' data: blob: https:;
    frame-src https://accounts.google.com https://login.microsoftonline.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Outfit:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header" data-plugin-anchor="header">
    <div class="header-inner" data-plugin-anchor="header-inner">
      <button class="brand" id="brandBtn" aria-label="Go to home" data-plugin-anchor="brand">CardSpoke</button>
      <div class="spacer"></div>
      <span id="saveStatus" class="save-status" title="" data-plugin-anchor="save-status"></span>
      <button class="header-btn" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo last action" data-plugin-anchor="btn-undo">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
      </button>
      <button class="header-btn" id="homeBtn" title="Home" aria-label="Go to home" data-plugin-anchor="btn-home">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </button>
      <button class="header-btn" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode" data-plugin-anchor="btn-theme-toggle">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <button class="header-btn" id="menuBtn" title="Open menu" aria-label="Open menu" data-plugin-anchor="btn-menu">☰</button>
    </div>
  </header>

  <div class="menu-overlay" id="menuOverlay" data-plugin-anchor="menu-overlay">
    <div class="menu-panel" data-plugin-anchor="menu-panel">
      <div class="menu-header">
        <div class="menu-title">Menu</div>
        <button class="menu-close" id="menuClose" aria-label="Close menu">✕</button>
      </div>
      
      <div class="menu-section">
        <div class="menu-section-title">Actions</div>
        <button class="menu-item" id="menuNewCard" data-plugin-anchor="menu-new-card">
          New Card
        </button>
        <button class="menu-item" id="menuUpload">
          Upload
        </button>
        <button class="menu-item" id="menuPluginManager" data-plugin-anchor="menu-plugin-manager">
          Plugin Manager
        </button>
        <button class="menu-item" id="menuAppearance">
          Appearance
        </button>
      </div>
      
      <div class="menu-section">
        <div class="menu-section-title">Navigate</div>
        <button class="menu-item" id="menuBookmarks">
          Bookmarks
        </button>
        <button class="menu-item" id="menuRecentCards">
          Recent Cards
        </button>
        <button class="menu-item" id="menuAdvancedSearch">
          Advanced Search
        </button>
        <button class="menu-item" id="menuTagManager">
          Tag Manager
        </button>
        <button class="menu-item" id="menuTrashBin">
          Trash Bin
        </button>
      </div>
      
      <div class="menu-section">
        <div class="menu-section-title">Data</div>
        <button class="menu-item" id="menuDataHub">
          Data & Export
        </button>
        <button class="menu-item menu-item-danger" id="menuClearAll">
          Clear All Data
        </button>
      </div>

      <div class="menu-section">
        <div class="menu-section-title">Help</div>
        <button class="menu-item" id="menuGettingStarted">
          Getting Started
        </button>
        <button class="menu-item" id="menuHelp">
          Help & Documentation
        </button>
        <button class="menu-item" id="menuKeyboardShortcuts">
          Keyboard Shortcuts
        </button>
      </div>

      <div class="menu-section" id="menuDeveloperSection" style="display: none;">
        <div class="menu-section-title">Developer</div>
        <button class="menu-item" id="menuDeveloperConsole">
          Developer Console
        </button>
      </div>
    </div>
  </div>
  </div>

  <div class="container">
    <div class="breadcrumbs" id="breadcrumbs" data-plugin-anchor="breadcrumbs"></div>
    
    <main id="main" data-plugin-anchor="main-content"></main>

    <footer class="app-footer" data-plugin-anchor="footer">
      <p>Creator: <span id="app-creator"></span></p>
      <p>Version: <span id="app-version"></span> (<span id="app-release-date"></span>) &mdash; Last update by: <span id="app-updater"></span></p>
    </footer>
    
  </div>

  <div class="search-container" id="searchContainer" style="display: none;" data-plugin-anchor="search-container">
    <div class="search-input-wrapper">
      <span class="search-icon">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </span>
      <input type="search" class="search-input" id="searchInput" placeholder="Search cards..." aria-label="Search cards" data-plugin-anchor="search-input" />
      <select class="dataset-selector" id="datasetSelector" title="Select dataset(s) to search" aria-label="Select dataset to search">
        <option value="current">Current Dataset</option>
        <option value="all">All Datasets</option>
      </select>
      <button class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" data-plugin-anchor="toast-container"></div>

  <div class="modal-overlay" id="uploadModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Upload Content</div>
        <button class="modal-close" id="closeUploadModal" aria-label="Close upload modal">✕</button>
      </div>
      
      <div class="modal-tabs" role="tablist">
        <button class="modal-tab active" data-tab="json" role="tab" aria-selected="true" aria-controls="tab-json">JSON</button>
        <button class="modal-tab" data-tab="txt" role="tab" aria-selected="false" aria-controls="tab-txt">TXT</button>
      </div>
      
      <div class="modal-body">
        <div class="tab-content active" id="tab-json" role="tabpanel" aria-labelledby="tab-json">
          <div class="file-upload-area" id="fileUploadAreaJSON">
            <div class="upload-text">Click to select or drag & drop JSON file</div>
            <div class="upload-hint">Supports card, subtree, and instance exports</div>
          </div>
          <input type="file" id="fileInputJSON" accept=".json" style="display: none;" />
          
          <div class="form-group">
            <label class="form-label">Import Location</label>
            <select id="importLocationSelectJSON" class="form-select">
              <option value="root">Add as Root Cards</option>
            </select>
          </div>
        </div>
        
        <div class="tab-content" id="tab-txt" role="tabpanel" aria-labelledby="tab-txt">
          <div class="file-upload-area" id="fileUploadAreaTXT">
            <div class="upload-text">Click to select or drag & drop TXT file</div>
            <div class="upload-hint">Plain text or hierarchical outline</div>
          </div>
          <input type="file" id="fileInputTXT" accept=".txt" style="display: none;" />
          
          <div class="form-group">
            <label class="form-label">Import Mode</label>
            <div class="radio-group">
              <label class="radio-option">
                <input type="radio" name="txtImportMode" value="outline" checked />
                <div class="radio-label">
                  <div>Create Cards from Outline</div>
                  <div class="radio-description">Parse hierarchical structure into cards</div>
                </div>
              </label>
              <label class="radio-option">
                <input type="radio" name="txtImportMode" value="append" />
                <div class="radio-label">
                  <div>Append to Card Body</div>
                  <div class="radio-description">Add text to existing card details</div>
                </div>
              </label>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Import Location</label>
            <select id="importLocationSelectTXT" class="form-select">
              <option value="root">Add as Root Cards (Outline Mode)</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Cloud Storage Libraries -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>

  <!-- Capacitor script - must be loaded before app scripts -->
  <script src="capacitor.js"></script>

  <!-- Application entry point (Vite serves as ES modules in dev, bundles for prod) -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
